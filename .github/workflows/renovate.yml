name: renovate
on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: renovatebot/github-action@v44.48.0
        with:
          configurationFile: config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
